<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tugas 5 JavaScript</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="container mt-5">
    <h2 class="text-center mb-4">Manajemen Toko Online</h2>

    <!-- Form Tambah Produk -->
    <div class="card mb-4 shadow-sm">
      <div class="card-body">
        <h5 class="card-title">Tambah Produk Baru</h5>
        <div class="row g-2">
          <div class="col-md-4">
            <input type="text" id="inputNama" class="form-control" placeholder="Nama Produk">
          </div>
          <div class="col-md-3">
            <input type="number" id="inputHarga" class="form-control" placeholder="Harga">
          </div>
          <div class="col-md-3">
            <input type="number" id="inputStok" class="form-control" placeholder="Stok">
          </div>
          <div class="col-md-2">
            <button class="btn btn-primary w-100" id="btn-tambah">Tambah</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tabel Daftar Produk -->
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title">Daftar Produk Tersedia</h5>
        <table class="table table-hover table-striped">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nama Produk</th>
              <th>Harga</th>
              <th>Stok</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tabel-produk">
            <!-- Data produk akan dimasukkan oleh JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Data Produk
    let produkList = [
      { id: 1, nama: "Laptop", harga: 12000000, stok: 5 },
      { id: 2, nama: "Smartphone", harga: 5000000, stok: 10 },
      { id: 3, nama: "Tablet", harga: 3000000, stok: 7 },
      { id: 4, nama: "Monitor", harga: 2500000, stok: 4 },
      { id: 5, nama: "Keyboard", harga: 500000, stok: 15 }
    ];

    // Event Handler Object
    const eventHandler = {
      // Event Listener untuk tombol tambah
      handleAddButton: function () {
        document.getElementById('btn-tambah').addEventListener('click', () => {
          const nama = document.getElementById('inputNama').value;
          const harga = parseInt(document.getElementById('inputHarga').value);
          const stok = parseInt(document.getElementById('inputStok').value);

          if (nama && harga && stok) {
            const idBaru = produkList.length > 0 ? Math.max(...produkList.map(p => p.id)) + 1 : 1;
            tambahProduk(idBaru, nama, harga, stok);
            tampilkanProduk();
            
            // Reset form
            document.getElementById('inputNama').value = '';
            document.getElementById('inputHarga').value = '';
            document.getElementById('inputStok').value = '';
          } else {
            alert('Mohon lengkapi semua data!');
          }
        });
      },

      // Event Delegation untuk tombol hapus
      handleDeleteButton: function () {
        document.getElementById('tabel-produk').addEventListener('click', (event) => {
          if (event.target.classList.contains('btn-hapus')) {
            const id = parseInt(event.target.dataset.id);
            hapusProduk(id);
            tampilkanProduk();
          }
        });
      }
    };

    // Tambah Produk dengan Spread Operator
    function tambahProduk(id, nama, harga, stok = 0, ...produkLainnya) {
      // Spread Operator untuk menambah produk baru ke array
      produkList = [...produkList, { id, nama, harga, stok }];

      // Jika ada produk lain yang ingin ditambahkan
      if (produkLainnya.length > 0) {
        produkList = [...produkList, ...produkLainnya];
      }

      console.log(`Tambah produk berhasil: ${nama}, Harga: ${harga}, Stok: ${stok}`);
      return produkList;
    }

    // Hapus Produk 
    function hapusProduk(id, ...idsLainnya) {
      // Menggunakan filter untuk menghapus produk
      produkList = produkList.filter(produk => produk.id !== id);

      // Jika ada ID lain yang ingin dihapus (Rest Parameter)
      if (idsLainnya.length > 0) {
        idsLainnya.forEach(idLain => {
          produkList = produkList.filter(produk => produk.id !== idLain);
        });
      }

      console.log(`Produk dengan ID ${id} berhasil dihapus`);
      return produkList;
    }

    // Menampilkan Produk dengan Destructuring
    function tampilkanProduk() {
      const tbody = document.getElementById('tabel-produk');
      tbody.innerHTML = '';

      produkList.forEach(({ id, nama, harga, stok }) => {
        const row = document.createElement('tr');
        row.innerHTML = `
      <td>${id}</td>
      <td>${nama}</td>
      <td>Rp ${harga.toLocaleString('id-ID')}</td>
      <td>${stok}</td>
      <td>
        <button class="btn btn-danger btn-sm btn-hapus" data-id="${id}">Hapus</button>
      </td>
    `;
        tbody.appendChild(row);
      });
    }

    // Inisialisasi Event Handler
    function init() {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
          eventHandler.handleAddButton();
          eventHandler.handleDeleteButton();
          tampilkanProduk();
        });
      } else {
        eventHandler.handleAddButton();
        eventHandler.handleDeleteButton();
        tampilkanProduk();
      }
    }

    // Jalankan inisialisasi
    init();

    // Penggunaan
    tambahProduk(6, "Mouse", 150000, 20);
    tampilkanProduk();

    hapusProduk(2);
    tampilkanProduk();

  </script>
</body>

</html>
