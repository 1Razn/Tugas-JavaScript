<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tugas 5 JavaScript</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="container mt-5">
    <h2 class="text-center mb-4">Manajemen Toko Online</h2>

    <!-- Form Tambah Produk -->
    <div class="card mb-4 shadow-sm">
      <div class="card-body">
        <h5 class="card-title">Tambah Produk Baru</h5>
        <div class="row g-2">
          <div class="col-md-4">
            <input type="text" id="inputNama" class="form-control" placeholder="Nama Produk">
          </div>
          <div class="col-md-3">
            <input type="number" id="inputHarga" class="form-control" placeholder="Harga">
          </div>
          <div class="col-md-3">
            <input type="number" id="inputStok" class="form-control" placeholder="Stok">
          </div>
          <div class="col-md-2">
            <button class="btn btn-primary w-100" id="btn-tambah">Tambah</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tabel Daftar Produk -->
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title">Daftar Produk Tersedia</h5>
        <table class="table table-hover table-striped">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nama Produk</th>
              <th>Harga</th>
              <th>Stok</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tabel-produk">
            <!-- Data produk akan dimasukkan oleh JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    //List data produk
    let produkToko = [
      { id: 1, nama: "Laptop", harga: 7000000, stok: 5 },
      { id: 2, nama: "Mouse", harga: 200000, stok: 10 },
      { id: 3, nama: "Keyboard", harga: 350000, stok: 7 },
      { id: 4, nama: "Monitor", harga: 1500000, stok: 3 },
      { id: 5, nama: "Printer", harga: 1200000, stok: 2 }
    ];

    //Fungsi Tampil Detail Produk (Destructuring)
    function tampilDetailProduk({ nama, harga, stok }) {
      console.log(`Detail: ${nama} - Rp ${harga.toLocaleString('id-ID')} - Stok: ${stok}`);
    }

    //Fungsi Tambah Banyak Produk (Rest Parameter)
    function tambahBanyakProduk(...produkBaru) {
      // Spread Operator (...) menyebarkan isi array lama dan array baru digabung
      produkToko = [...produkToko, ...produkBaru];
      console.log("Produk baru dari rest parameter berhasil ditambahkan:", produkBaru);
      tampilProduk();
    }

    //Fungsi Tambah Produk (Dari Form Input)
    function tambahProduk() {
      let nama = document.getElementById("inputNama").value;
      let harga = document.getElementById("inputHarga").value;
      let stok = document.getElementById("inputStok").value;

      if (nama && harga && stok) {
        let idTerakhir = 0;
        for (let i = 0; i < produkToko.length; i++) {
          if (produkToko[i].id > idTerakhir) {
            idTerakhir = produkToko[i].id;
          }
        }
        let idBaru = idTerakhir + 1;

        //Tambahkan produk baru ke array produkToko menggunakan spread operator
        produkToko = [...produkToko, {
          id: idBaru,
          nama: nama,
          harga: parseInt(harga),
          stok: parseInt(stok)
        }];

        //Reset form
        document.getElementById("inputNama").value = "";
        document.getElementById("inputHarga").value = "";
        document.getElementById("inputStok").value = "";

        console.log("Produk baru dari form berhasil ditambahkan:", produkToko);
        tampilProduk();
      } else {
        alert("Isi semua data produk sebelum menambahkan!");
      }
    }

    //Fungsi Hapus Produk
    function hapusProduk(id) {
      // Filter membuat array baru tanpa elemen yang id-nya cocok
      produkToko = produkToko.filter(produk => produk.id !== id);
      tampilProduk();
    }

    //Fungsi Tampil Produk dengan DESTRUCTURING di forEach
    function tampilProduk() {
      let tbody = document.getElementById("tabel-produk");
      tbody.innerHTML = "";

      // Fungsi Tampil Produk dengan destructuring di forEach
      produkToko.forEach(({ id, nama, harga, stok }) => {
        let baris = `
      <tr>
        <td>${id}</td>
        <td>${nama}</td>
        <td>Rp ${harga.toLocaleString('id-ID')}</td>
        <td>${stok}</td>
        <td>
          <!-- Tambahkan class 'btn-hapus' dan data-id untuk Event Delegation -->
          <button class="btn btn-danger btn-hapus" data-id="${id}">Hapus</button>
        </td>
      </tr>
    `;
        tbody.innerHTML += baris;
      });

      //Event Delegation untuk tombol hapus
      tbody.addEventListener('click', (event) => {
        if (event.target.classList.contains('btn-hapus')) {
          let id = parseInt(event.target.dataset.id);
          hapusProduk(id);
        }
      });
    }

    //Event Listener untuk tombol tambah
    document.getElementById("btn-tambah").addEventListener("click", tambahProduk);

    //Jalankan saat halaman dibuka
    tampilProduk();

    //Contoh pemanggilan fungsi destructuring & rest parameter 
    tampilDetailProduk(produkToko[0]);
    tambahBanyakProduk({id: 6, nama: "Headset", harga: 300000, stok: 5}, {id: 7, nama: "Webcam", harga: 450000, stok: 2});

  </script>
</body>

</html>
