<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tugas 4 JavaScript</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="container mt-5">
    <h2 class="text-center mb-4">Manajemen Sewa Kendaraan</h2>

    <!-- Tabel Daftar Pelanggan -->
    <div class="card shadow-lg">
      <div class="card-body">
        <h5 class="card-title">Daftar Pelanggan yang Sewa Kendaraan</h5>
        <table class="table table-hover table-striped table-bordered">
          <thead class="table-primary">
            <tr>
              <th>Nama Pelanggan</th>
              <th>Nomor Telepon</th>
              <th>Nama Kendaraan</th>
              <th>Tipe Kendaraan</th>
              <th>Harga Sewa</th>
            </tr>
          </thead>
          <tbody id="table-sewa">
            <!-- Data pelanggan akan dimasukkan oleh JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    //Class Kendaraan
    class Kendaraan {
      constructor(nama, jenis, platNomor, hargaSewa) {
        this.nama = nama;
        this.jenis = jenis;
        this.platNomor = platNomor;
        this.hargaSewa = hargaSewa;
      }
    }

    //Class Pelanggan
    class Pelanggan {
      constructor(nama, nomorTelepon, alamat) {
        this.nama = nama;
        this.nomorTelepon = nomorTelepon;
        this.kendaraanDisewa = null;
      }

      sewaKendaraan(kendaraan) {
        this.kendaraanDisewa = kendaraan;
      }
    }

    //Isi Data Kendaraan
    let Avanza = new Kendaraan("Toyota Avanza", "Mobil", "B 1234 XYZ", 500000);
    let Vario = new Kendaraan("Honda Vario", "Motor", "B 5678 ABC", 100000);
    let Ertiga = new Kendaraan("Suzuki Ertiga", "Mobil", "B 9876 DEF", 600000);

    //Isi Data Pelanggan
    let pelanggan1 = new Pelanggan("Andi", "081234567890", "Jl. Merdeka No. 1");
    let pelanggan2 = new Pelanggan("Budi", "081987654321", "Jl. Sudirman No. 2");
    let pelanggan3 = new Pelanggan("Citra", "081345678901", "Jl. Thamrin No. 3");

    //Pelanggan Menyewa Kendaraan
    pelanggan1.sewaKendaraan(Ertiga);
    pelanggan2.sewaKendaraan(Vario);
    
    //Cek console.log untuk memastikan data sudah benar
    console.log(pelanggan1);
    console.log(pelanggan2);
    console.log(pelanggan3);

    // Daftar Pelanggan
    let daftarSewa = [pelanggan1, pelanggan2, pelanggan3];

    // Menampilkan Info Kendaraan yang Disewa
    function tampilkanDaftarSewa() {
      let tbody = document.getElementById("table-sewa");
      tbody.innerHTML = "";

      daftarSewa.forEach(Pelanggan => {
        if (Pelanggan.kendaraanDisewa !== null) {
          let kendaraan = Pelanggan.kendaraanDisewa;
          let baris = `
            <tr>
              <td>${Pelanggan.nama}</td>
              <td>${Pelanggan.nomorTelepon}</td>
              <td>${Pelanggan.kendaraanDisewa.nama}</td>
              <td>${Pelanggan.kendaraanDisewa.jenis}</td>
              <td>Rp ${Pelanggan.kendaraanDisewa.hargaSewa.toLocaleString('id-ID')}</td>
            </tr>
          `;
          tbody.innerHTML += baris;
        }
      })
    }

    tampilkanDaftarSewa();
  </script>
</body>

</html>
