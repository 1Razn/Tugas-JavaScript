<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tugas 3 JavaScript</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="container mt-5">
    <h2 class="text-center mb-4">Manajemen Toko Online</h2>

    <!-- Form Tambah Produk -->
    <div class="card mb-4 shadow-sm">
      <div class="card-body">
        <h5 class="card-title">Tambah Produk Baru</h5>
        <div class="row g-2">
          <div class="col-md-4">
            <input type="text" id="inputNama" class="form-control" placeholder="Nama Produk">
          </div>
          <div class="col-md-3">
            <input type="number" id="inputHarga" class="form-control" placeholder="Harga">
          </div>
          <div class="col-md-3">
            <input type="number" id="inputStok" class="form-control" placeholder="Stok">
          </div>
          <div class="col-md-2">
            <button class="btn btn-primary w-100" onclick="tambahProduk()">Tambah</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tabel Daftar Produk -->
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title">Daftar Produk Tersedia</h5>
        <table class="table table-hover table-striped">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nama Produk</th>
              <th>Harga</th>
              <th>Stok</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tabel-produk">
            <!-- Data produk akan dimasukkan oleh JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    //Array Produk Toko
    let produkToko = [
      { id: 1, nama: "Laptop", harga: 7000000, stok: 5 },
      { id: 2, nama: "Mouse", harga: 200000, stok: 10 },
      { id: 3, nama: "Keyboard", harga: 350000, stok: 7 }
    ];

    //Fungsi Tampil Produk Baru
    function tampilProduk() {
      let tbody = document.getElementById("tabel-produk");
      tbody.innerHTML = "";

      for (let i = 0; i < produkToko.length; i++) {
        let produk = produkToko[i];
        let baris = `
          <tr>
            <td>${produk.id}</td>
            <td>${produk.nama}</td>
            <td>Rp ${produk.harga.toLocaleString('id-ID')}</td>
            <td>${produk.stok}</td>
            <td>
              <button class="btn btn-danger" onclick="hapusProduk(${produk.id})">Hapus</button>
            </td>
          </tr>
        `;
        tbody.innerHTML += baris;
      }
    }

    // Fungsi Tambah Produk
    function tambahProduk() {
      let nama = document.getElementById("inputNama").value;
      let harga = document.getElementById("inputHarga").value;
      let stok = document.getElementById("inputStok").value;

      if (nama && harga && stok) {
        let idTerakhir = 0;
        for (let i = 0; i < produkToko.length; i++) {
          if (produkToko[i].id > idTerakhir) {
            idTerakhir = produkToko[i].id;
          }
        }
        let idBaru = idTerakhir + 1;

        produkToko.push({ id: idBaru, nama: nama, harga: parseInt(harga), stok: parseInt(stok) });
        console.log("Cek isi Array setelah ditambah:", produkToko); // ccek array nya bertambah atau tidak di console
        tampilProduk();

        document.getElementById("inputNama").value = "";
        document.getElementById("inputHarga").value = "";
        document.getElementById("inputStok").value = "";

      } else {
        alert("Isi semua data produk sebelum menambahkan!");
      }
    }

    // Fungsi Hapus Produk
    function hapusProduk(id) {
      let index = produkToko.findIndex(function (produk) {
        console.log("Cek isi Array setelah dihapus:", produkToko);
        return produk.id === id;
      });

      if (index !== -1) {
        produkToko.splice(index, 1);
        tampilProduk();
      }
    }

    tampilProduk(); // Tampilkan produk saat halaman dibuka

  </script>
</body>

</html>
